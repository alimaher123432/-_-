backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    fields:
      - {label: "اسم المنتج", name: "title", widget: "string"}
      - {label: "السعر", name: "price", widget: "string"}
      - {label: "رابط الصورة", name: "image", widget: "string"}
      - {label: "رابط الواتساب", name: "whatsapp", widget: "string"}
