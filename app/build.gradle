plugins {
    id 'com.android.application'
}

android {
    namespace 'iq.edu.hasanschool'
    compileSdk 35

    defaultConfig {
        applicationId 'iq.edu.hasanschool'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
